global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Every API replica: Docker DNS returns one A record per replica for the service name.
  - job_name: api
    dns_sd_configs:
      - names: [ api ]
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: worker
    static_configs:
      - targets: [ "worker:8081" ]

  - job_name: cadvisor
    static_configs:
      - targets: [ "cadvisor:8080" ]

  - job_name: redis
    static_configs:
      - targets: [ "redis-exporter:9121" ]

  - job_name: postgres
    static_configs:
      - targets: [ "postgres-exporter:9187" ]
