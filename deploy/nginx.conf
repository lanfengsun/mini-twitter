worker_processes auto;
error_log /dev/stderr warn;

events { worker_connections 4096; }

http {
  include /etc/nginx/mime.types;
  access_log off;               # request logs come from the API (sampled, structured)
  sendfile on;

  # Docker's embedded DNS returns one A record per `api` replica. `resolve` makes nginx
  # re-resolve it, so `docker compose up --scale api=N` takes effect without a reload.
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream api {
    zone api_zone 64k;
    server api:8080 resolve;
    keepalive 256;              # reuse connections: avoids ephemeral-port exhaustion at high RPS
  }

  server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $request_id;   # propagated to the API and echoed to the client
      proxy_connect_timeout 2s;
      proxy_read_timeout 10s;
    }

    location = /healthz { default_type text/plain; return 200 "ok\n"; }

    location / { try_files $uri /index.html; }
  }
}
